---
title: SSH Failures Spread Across Accounts
name: password_spraying
status: experimental
description: >-
  Selects SSH password failures. The Python implementation requires several
  distinct usernames per customer and source IP with a low failure count per user.
logsource:
  product: linux
  service: sshd
detection:
  selection:
    action: ssh_failure
  condition: selection
falsepositives:
  - A shared gateway relaying failures for several unrelated users
level: high
tags:
  - attack.credential_access
  - attack.t1110.003
