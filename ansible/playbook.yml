---
- name: Build the synthetic SIEM lab on the GitHub Actions runner
  hosts: lab
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    siem_lab_user: siemlab
    siem_lab_group: siemlab
    siem_lab_install_dir: /opt/siem-alerting-lab
    siem_lab_state_dir: /var/lib/siem-alerting-lab
    siem_lab_config_dir: /etc/siem-alerting-lab
    siem_lab_rsyslog_dir: /var/log/siem-alerting-lab
    siem_lab_customers:
      - alder-retail
      - cedar-freight
      - harbor-studio
  roles:
    - siem_lab_account
    - siem_lab_runtime
    - siem_lab_rsyslog
